<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;min-height:100vh;padding-bottom:40px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2{margin:0;font-weight:700}
.app{max-width:560px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 8px}
.top h1{font-size:1rem;letter-spacing:.02em;text-transform:uppercase;color:var(--ink2);font-weight:700}

.wk{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.wk .nav{background:none;border:none;font-size:1.4rem;padding:4px 12px;color:var(--ink2)}
.wk .title{text-align:center;background:none;border:none;font-weight:600;min-width:0}
.wk .title small{display:block;color:var(--ink2);font-weight:500;font-size:.82rem}
.hero{margin:6px 0 4px}
.num{font-size:clamp(2.6rem,12vw,3.4rem);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.num span{font-size:.42em;font-weight:600;color:var(--ink2);letter-spacing:0;margin-left:6px}
.hero .sub{color:var(--ink2);font-size:.9rem;margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{border:1px solid var(--line);background:none;border-radius:20px;padding:4px 12px;font-size:.8rem;color:var(--ink2);white-space:nowrap}
.pill.on{background:var(--soft);color:var(--soft-ink);border-color:var(--soft)}
.prog{height:4px;background:var(--bar);border-radius:2px;margin:12px 0 18px;overflow:hidden}
.prog div{height:100%;background:var(--fill);border-radius:2px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:84px;align-items:end;margin-bottom:26px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.day .col{width:100%;background:var(--bar);border-radius:5px;min-height:3px}
.day .col.f{background:var(--fill)}
.day .col.t{outline:2px solid var(--accent);outline-offset:2px}
.day small{font-size:.72rem;color:var(--ink2)}
.day small.free{opacity:.4;text-decoration:line-through}
.timer{background:var(--c,var(--soft));color:var(--ci,var(--soft-ink));border-radius:var(--r);padding:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;min-width:0}
.timer>div{min-width:0;flex:1}
.timer .cat{font-weight:600;font-size:.9rem;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer .clock{font-size:clamp(1.5rem,7.5vw,2.2rem);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.timer .stop{background:var(--surface);color:var(--ci,var(--soft-ink));border:none;border-radius:12px;padding:12px 18px;font-weight:700;flex:none}
.lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:700;margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:22px}
.tile{position:relative;min-width:0;overflow:hidden;background:var(--c,var(--surface));color:var(--ci,var(--ink));border:1px solid transparent;border-radius:var(--r);padding:14px 12px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:88px;transition:transform .08s}

.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.row .m{width:8px;align-self:stretch;border-radius:4px;background:var(--bar);flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--ink2);font-size:.82rem}
.row .d{font-variant-numeric:tabular-nums;font-weight:600}
.row.off .t,.row.off .d{opacity:.45}
.row.off .t b{text-decoration:line-through}
.empty{color:var(--ink2);text-align:center;padding:24px 0;font-size:.92rem}
.ov{padding-top:10px}
.ov .num{font-size:clamp(3rem,15vw,4.2rem)}
.ov .sub{color:var(--ink2);font-size:.9rem;margin:10px 0 26px}
.ov2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ov2>*{background:var(--c);color:var(--ci);border-radius:var(--r);padding:16px 14px;min-width:0;border:none;text-align:left;font:inherit;display:block;appearance:none;-webkit-appearance:none;margin:0;width:100%}
.ov2 small{display:block;font-size:.82rem;font-weight:600;opacity:.8;margin-bottom:8px}
.ov2 b{font-size:1.7rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ov2 b span{font-size:.45em;font-weight:600;opacity:.7;margin-left:4px}
.bars{position:relative;display:flex;gap:4px;align-items:flex-end;margin:0 0 6px}
.bars .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;min-width:0;position:relative;z-index:1}
.bars .bar div{width:100%;background:var(--fill);border-radius:4px 4px 2px 2px}
.bars .bar.part div{background:var(--fill);opacity:.45}
.bars .bar.hol div{background:var(--bar)}
.bars .bar.miss div{background:var(--warn-bg)}
.bars em{font-style:normal;font-size:.68rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1}
.bars .bar.hol em,.bars .bar.part em{color:var(--ink2);font-weight:600}
.bars small{font-size:.62rem;color:var(--ink2);line-height:1}
.bars .soll{position:absolute;left:0;right:0;border-top:1px dashed var(--ink2);z-index:0;opacity:.6}
.bars .soll span{position:absolute;right:0;top:-14px;font-size:.62rem;color:var(--ink2);background:var(--bg);padding:0 3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.72rem;color:var(--ink2);margin:0 0 20px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--fill)}

.ov2 button{cursor:pointer}
.bd div{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:8px;border-radius:12px;background:var(--c);color:var(--ci)}

.bd .pct{opacity:.7;font-size:.85rem;font-variant-numeric:tabular-nums}

.year{margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
.year .num{font-size:clamp(2.2rem,10vw,2.8rem)}

.warn{margin-top:22px;background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-size:.9rem;font-weight:600}
.warn small{display:block;font-weight:500;margin-top:2px;opacity:.9}
.wkchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wkchips button{border:none;background:var(--surface);color:var(--warn-ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.85rem}
.grid{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));gap:4px;margin-bottom:14px}
.grid .h{text-align:center;font-size:.78rem;color:var(--ink2);font-weight:700;padding:4px 0}

.cell{min-width:0;overflow:hidden;hyphens:auto;-webkit-hyphens:auto;border:1px dashed var(--line);background:none;border-radius:8px;min-height:48px;font-size:.78rem;font-weight:700;color:#fff;padding:4px;line-height:1.15;word-break:break-word}

.link{background:none;border:none;color:var(--accent);font-weight:600;padding:8px 0;font-size:.92rem}
.vers{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;align-items:center}

.field label{display:block;font-size:.8rem;color:var(--ink2);margin-bottom:6px;font-weight:600}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:none;border-radius:12px;padding:14px;font-weight:700;background:var(--surface2)}
.btn.p{background:var(--soft);color:var(--soft-ink)}

.frees div small{display:block;color:var(--ink2);font-size:.82rem}

.auth{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:60px 18px 20px;overflow:auto}

input[type=email],input[type=password]{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;min-height:46px}

.toast.show{opacity:1}
.toast.act{pointer-events:auto;padding-right:10px}
.toast button{margin:0;border:none;background:var(--soft);color:var(--soft-ink);border-radius:8px;padding:6px 10px;font-weight:700;font-size:.85rem;line-height:1.2;flex:none}
.note{font-size:.85rem;color:var(--ink2);margin-top:14px}
.tt{width:100%;border-collapse:collapse}
.tt td{padding:4px 4px 4px 0}
.tt td:first-child{color:var(--ink2);white-space:nowrap;font-size:.85rem}
textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;font:inherit;color:inherit}
</style>
</head>

/* Helfer */
function pad(n){return (n<10?"0":"")+n}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

  [[y+"-01-01","Neujahr"],o(-2,"Karfreitag"),o(1,"Ostermontag"),[y+"-05-01","Tag der Arbeit"],o(39,"Christi Himmelfahrt"),o(50,"Pfingstmontag"),o(60,"Fronleichnam"),[y+"-10-03","Tag der Deutschen Einheit"],[y+"-11-01","Allerheiligen"],[y+"-12-25","1. Weihnachtstag"],[y+"-12-26","2. Weihnachtstag"]].forEach(([d,n])=>h[d]=n);holCache[y]=h;return h}
/* frei? → Bezeichnung oder null */

  for(const r of NRW_FERIEN)if(ds>=r[0]&&ds<=r[1])return {label:r[2]+" NRW",type:"free"};
  for(const r of (S.settings.free||[]))if(ds>=r.from&&ds<=r.to)return {label:r.label||(r.type==="sick"?"Krank":"frei"),type:r.type==="sick"?"sick":"free"};

/* Stundenplan-Versionen */
function normPlan(p){let vs=[];if(p&&Array.isArray(p.versions))vs=p.versions.map(v=>({id:v.id||uid(),from:v.from||null,items:Array.isArray(v.items)?v.items.slice():[],raster:normRaster(v.raster)}));
  else if(p&&Array.isArray(p.items))vs=[{id:"v0",from:null,items:p.items.slice(),raster:normRaster(p.raster)}];
  if(!vs.length)vs=[{id:"v0",from:null,items:[],raster:normRaster(null)}];
  vs.sort((a,b)=>(a.from||"")<(b.from||"")?-1:1);return {versions:vs}}

  for(let d=0;d<5;d++){const ds=ymd(addDays(mon,d));if(free[d])continue;const v=versionFor(ds);if(!v)continue;
    v.items.filter(it=>it.day===d).forEach(it=>{const {start,end}=itemTimes(it,v.raster);const m=minutesBetween(start,end);if(m<1)return;
      out.push({id:"plan:"+it.id+":"+ds,planId:it.id,plan:true,cancelled:canc.includes(it.id),date:ds,start,end,minutes:m,courseId:it.courseId||"",activity:"Unterricht"})})}
  return out}

const chain={};

function subscribeWeek(key){if(!S.db||S.subscribedWeek===key)return;if(S.weekUnsub){S.weekUnsub();S.weekUnsub=null}S.subscribedWeek=key;
  S.weekUnsub=S.db.doc("weeks/"+key).onSnapshot(s=>{if(s.exists)S.weeks[key]=weekFromDoc(key,s.data());else if(!S.weeks[key])S.weeks[key]=weekFromDoc(key,null);if(S.tab==="woche")render()},e=>{console.error(e);setDot(false)})}

  if(S.db){try{const snap=await S.db.collection("weeks").where("key",">=",fk).where("key","<=",tk).get();snap.docs.forEach(d=>{const x=d.data();if(x&&x.key){const w=weekFromDoc(x.key,x);out[x.key]=w;if(x.key!==S.subscribedWeek)S.weeks[x.key]=w}})}catch(e){console.error(e)}}return out}
let unsubs=[];

  if(m>240){openLongTimer(t,m,then);return}await finishTimer(t,m);if(then)await then()}
async function finishTimer(t,m){const st=new Date(t.startedAt);S.timer=null;await persistTimer();const e={id:uid(),date:ymd(st),start:hm(st),end:hm(new Date(st.getTime()+m*60000)),minutes:m,courseId:"",activity:t.activity};await addEntry(e);undoToast(t.activity+": "+fmtMin(m)+" h gespeichert",e)}

  $("ltS").onclick=async()=>{const mm=parseHours($("ltH").value);if(mm<1){toast("Dauer prüfen");return}close();await finishTimer(t,mm);if(then)await then()}}

  if(ok===nk){wo.entries=wo.entries.concat([e]);await persistWeek(ok)}else{await persistWeek(ok);const wn=await ensureWeek(nk);wn.entries=wn.entries.concat([e]);await persistWeek(nk)}render()}

function ranges(idx){const parts=[];if(!idx.length)return parts;let s=idx[0],p=idx[0];for(let i=1;i<=idx.length;i++){if(idx[i]===p+1){p=idx[i];continue}parts.push(s===p?WD[s]:WD[s]+" bis "+WD[p]);s=idx[i];p=idx[i]}return parts}

  if(fi.length===5)return "Ferien";const out=[];if(fi.length)out.push("frei "+ranges(fi).join(", "));if(si.length)out.push("krank "+ranges(si).join(", "));return out.length?out.join(" · "):null}

function renderWoche(){
  const mon=S.viewMonday,key=weekKeyOfDate(mon),sun=addDays(mon,6),today=ymd(new Date());subscribeWeek(key);
  const wk=S.weeks[key]||{entries:[],cancelled:[]};const free=freeDays(key);const fs=freeSummary(free);
  const planAll=planEntriesForWeek(key);const manual=wk.entries||[];
  const sick=sickEntries(key);const counted=manual.concat(planAll.filter(p=>!p.cancelled&&p.date<=today)).concat(sick);
  const total=counted.reduce((s,e)=>s+e.minutes,0);const target=S.settings.weeklyTarget*60;
  const perDay=[0,0,0,0,0,0,0];counted.forEach(e=>{perDay[(parseYmd(e.date).getDay()+6)%7]+=e.minutes});const maxDay=Math.max(60,...perDay);
  const perCat={};manual.forEach(e=>{perCat[e.activity]=(perCat[e.activity]||0)+e.minutes});
  const list=manual.concat(planAll).concat(sick).sort((a,b)=>(a.date+(a.start||"99"))<(b.date+(b.start||"99"))?-1:1);
  const w=isoWeek(mon);const isCur=key===weekKeyOfDate(new Date());const diff=total-target;
  let h="";
  h+=`<div class="wk"><button class="nav" id="prev">‹</button><button class="title" id="cur">KW ${w.week}<small>${fmtDateShort(mon)} bis ${fmtDateShort(sun)}${isCur?"":" · zurück zu heute"}</small></button><button class="nav" id="next">›</button></div>
  <div class="hero"><div class="num">${fmtMin(total)}<span>h</span></div>
    <div class="sub"><span>${fs==="Ferien"?"Ferienwoche":(target?(diff>=0?"+":"−")+fmtMin(Math.abs(diff))+" h gegenüber Soll "+S.settings.weeklyTarget+" h":"")}</span><button class="pill ${fs?"on":""}" id="free">${fs||"Frei?"}</button></div></div>

  const booked=list.filter(e=>!(e.plan&&e.date>today)),planned=list.filter(e=>e.plan&&e.date>today);
  const rowHtml=e=>{const off=e.cancelled||(e.plan&&e.date>today);const tag=e.sick?"gutgeschrieben (Tagessoll)":e.plan?(e.cancelled?"entfallen":(e.date>today?"geplant":"Stundenplan")):(e.start?e.start+" bis "+e.end:"manuell");

  const dayHead=e=>{const d=parseYmd(e.date);const i=(d.getDay()+6)%7;return `<div class="dh"><span>${WDL[i]}, ${fmtDateShort(d)}${free[i]?" · "+esc(free[i].label):""}</span><span>${fmtMin(perDay[i])} h</span></div>`};

  if(planned.length){const pm=planned.reduce((s,e)=>s+e.minutes,0);const openP=!!S.plannedOpen;
    h+=`<button class="lbl toggle" id="tgl"><span>Noch geplant · ${planned.length} Std. · ${fmtMin(pm)} h</span><span class="chev ${openP?"up":""}">›</span></button><div class="${openP?"":"hidden"}">`;
    cur=null;planned.forEach(e=>{if(e.date!==cur){cur=e.date;h+=dayHead(e)}h+=rowHtml(e)});h+=`</div>`}
  h+=`</div>`;view.innerHTML=h;
  $("prev").onclick=()=>{S.viewMonday=addDays(S.viewMonday,-7);render()};$("next").onclick=()=>{S.viewMonday=addDays(S.viewMonday,7);render()};$("cur").onclick=()=>{S.viewMonday=mondayOf(new Date());render()};
  $("free").onclick=()=>openFree(key);const stop=$("stop");if(stop)stop.onclick=()=>stopTimer(null);const tg=$("tgl");if(tg)tg.onclick=()=>{S.plannedOpen=!S.plannedOpen;render()};

  if(S.timer){const upd=()=>{const c=$("clock");if(!c||!S.timer)return;const s=Math.max(0,Math.floor((Date.now()-new Date(S.timer.startedAt))/1000));c.textContent=Math.floor(s/3600)+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)};upd();if(!tick)tick=setInterval(upd,1000)}else if(tick){clearInterval(tick);tick=null}

function renderUeb(){
  const mon=mondayOf(new Date());const k13=[];for(let i=13;i>=1;i--)k13.push(weekKeyOfDate(addDays(mon,-7*i)));const k52=[];for(let i=52;i>=1;i--)k52.push(weekKeyOfDate(addDays(mon,-7*i)));
  const compute=()=>{let n=0,tot=0,u=0;const forgot=[];
    let first=null;Object.values(S.weeks).forEach(w=>{if(w.entries&&w.entries.length&&(!first||w.key<first))first=w.key});
    const cats={};const bars=[];
    k13.forEach(k=>{const hol=isHolidayWeek(k);const fd=freeDays(k).slice(0,5).filter(Boolean).length;const part=!hol&&fd>0;const w=S.weeks[k];const has=(w&&w.entries&&w.entries.length)||sickEntries(k).length;const es=effectiveEntries(k);const t=es.reduce((s,e)=>s+e.minutes,0);bars.push({k,t,hol,part,has});if(hol||part||!has)return;n++;tot+=t;
      es.forEach(e=>{if(TEACH.includes(e.activity))u+=e.minutes;else cats[e.activity]=(cats[e.activity]||0)+e.minutes})});
    if(first)k52.forEach(k=>{if(k<first||isHolidayWeek(k))return;const w=S.weeks[k];if(!((w&&w.entries&&w.entries.length)||sickEntries(k).length))forgot.push(k)});
    let year=null;if(first&&first<=k52[0]){let ytot=0;k52.forEach(k=>{ytot+=effectiveEntries(k).reduce((s,e)=>s+e.minutes,0)});year={perWeek:ytot/52}}
    const yearFrom=first?addDays(mondayOfKey(first),52*7):null;
    return {n,avg:n?tot/n:0,avgU:n?u/n:0,avgR:n?(tot-u)/n:0,forgot,year,yearFrom,cats,bars}};
  const draw=(r,loading)=>{
    const soll=S.settings.weeklyTarget*46/52;
    let h=r.n?`<div class="ov"><div class="lbl">Durchschnitt pro Schulwoche</div><div class="num">${fmtMin(r.avg)}<span>h</span></div><div class="sub">${fmtDateShort(addDays(mon,-7*13))} bis ${fmtDateShort(addDays(mon,-1))} · ${r.n} volle Schulwochen. Ferien und Wochen mit freien Tagen nicht gezählt.</div>
      ${(()=>{const mx=Math.max(60,...r.bars.map(x=>x.t))*1.12;const H=90;return `<div class="bars" style="height:${H+34}px">${r.bars.map(b=>`<div class="bar ${b.hol?"hol":""} ${b.part?"part":""} ${!b.hol&&!b.has?"miss":""}"><em>${b.hol&&!b.t?"":Math.round(b.t/60)}</em><div style="height:${Math.max(3,Math.round(b.t/mx*H))}px"></div><small>${Number(b.k.slice(6))}</small></div>`).join("")}</div><div class="legend"><span><i class="l1"></i>volle Schulwoche</span><span><i class="l2"></i>freie Tage</span><span><i class="l3"></i>Ferien</span><span><i class="l4"></i>ohne Einträge</span></div>`})()}
      <div class="ov2"><div style="${catVars("Unterricht")}"><small>Unterricht</small><b>${fmtMin(r.avgU)}<span>h</span></b></div><button id="ovR" style="${catVars("Unterrichtsvorbereitung")}"><small>Vorbereitung etc. ›</small><b>${fmtMin(r.avgR)}<span>h</span></b></button></div>`
      :`<div class="ov"><div class="empty">${loading?"lade…":"Noch keine abgeschlossene Schulwoche mit Einträgen in den letzten drei Monaten."}</div>`;
    if(r.year)h+=`<div class="year"><div class="lbl">Jahresbilanz</div><div class="num">${fmtDec(r.year.perWeek)}<span>h pro Woche</span></div><div class="sub">Soll ${soll.toFixed(1).replace(".",",")} h, ausgehend von ${S.settings.weeklyTarget} h und 30 Urlaubstagen · letzte 52 Wochen inkl. Ferien</div></div>`;
    else if(r.yearFrom)h+=`<div class="year"><div class="sub" style="margin:0">Jahresbilanz ab ${fmtDateShort(r.yearFrom)} ${r.yearFrom.getFullYear()}, sobald 52 Wochen vorliegen.</div></div>`;
    if(r.forgot.length&&!loading)h+=`<div class="warn">Woche vergessen einzutragen?<small>Schulwochen ohne Einträge, antippen öffnet die Woche</small><div class="wkchips">${r.forgot.map(k=>`<button data-k="${k}">KW ${Number(k.slice(6))}/${k.slice(2,4)}</button>`).join("")}</div></div>`;
    view.innerHTML=h+`</div>`;const ovR=$("ovR");if(ovR)ovR.onclick=()=>openBreakdown(r);view.querySelectorAll(".wkchips button").forEach(b=>b.onclick=()=>{S.viewMonday=mondayOfKey(b.dataset.k);S.tab="woche";render();window.scrollTo(0,0)})};
  draw(compute(),!!S.db&&!S.ovLoaded);
  if(S.db&&!S.ovLoaded){weeksInRange(k52[0],k52[k52.length-1]).then(()=>{S.ovLoaded=true;if(S.tab==="ueb")draw(compute(),false)})}
}

function openBreakdown(r){const rows=Object.entries(r.cats).sort((a,b)=>b[1]-a[1]);const tot=rows.reduce((s,x)=>s+x[1],0);
  open(`<h2>Vorbereitung etc.</h2><div class="sub">Durchschnitt pro voller Schulwoche, ${r.n} Wochen</div><div class="bd">${rows.map(([c,m])=>`<div style="${catVars(c)}"><span class="t">${esc(c)}</span><span class="pct">${tot?Math.round(m/tot*100):0} %</span><b>${fmtMin(m/r.n)} h</b></div>`).join("")}</div><div class="acts"><button class="btn" id="c">Schließen</button></div>`);$("c").onclick=close}

function renderPlan(){
  const v=currentVersion();const r=v.raster;const items=v.items;const today=ymd(new Date());
  const cellOf=(d,i)=>items.find(it=>it.day===d&&it.from===i+1);
  let h="";
  if(S.plan.versions.length>1||v.from){h+=`<div class="vers">${S.plan.versions.map(x=>`<button class="pill ${x.id===v.id?"on":""}" data-v="${x.id}">${x.from?(x.from>today?"ab ":"seit ")+fmtDate(x.from):"Grundplan"}</button>`).join("")}</div>`}
  const paint=S.planPaint&&courseById(S.planPaint)?S.planPaint:null;S.planPaint=paint;
  h+=`<div class="courses">${S.courses.map(c=>`<button class="chip ${paint===c.id?"on":""}" data-c="${c.id}"><i style="background:${c.color}"></i>${esc(c.name)}</button>`).join("")}<button class="chip x" id="newCourse">+ Kurs</button>${paint?`<button class="chip x" id="editCourse">✎ ${esc(courseName(paint))}</button>`:""}</div>
  <p class="note" style="margin:0 0 10px">${paint?"Felder antippen, um „"+esc(courseName(paint))+"“ einzutragen oder zu löschen. Chip erneut antippen beendet den Modus.":"Kurs oben wählen, dann Felder antippen. Belegte Felder lassen sich ziehen."}</p>`;
  h+=`<div class="grid"><div></div>${WD.slice(0,5).map(x=>`<div class="h">${x}</div>`).join("")}`;
  r.forEach((t,i)=>{h+=`<div class="tm"><b>${i+1}.</b>${t[0]}</div>`;for(let d=0;d<5;d++){const it=cellOf(d,i);h+=it?`<button class="cell f" data-d="${d}" data-i="${i}" style="background:${courseColor(it.courseId)}">${esc(courseName(it.courseId))}</button>`:`<button class="cell" data-d="${d}" data-i="${i}"></button>`}});
  const wm=items.reduce((s,it)=>{const t=itemTimes(it,r);return s+minutesBetween(t.start,t.end)},0);
  h+=`</div><p class="note" style="margin:0 0 12px">${items.length} Std. · ${fmtMin(wm)} h pro Woche</p><div class="acts" style="margin:0"><button class="btn" id="times">Stundenzeiten</button><button class="btn" id="newVer">Neuer Plan</button></div>
  <p class="note">Jede Stunde zählt automatisch als Unterricht. Zum Halbjahr „Neuer Plan“: alte Wochen behalten den alten Plan.</p>`;
  view.innerHTML=h;
  view.querySelectorAll(".vers .pill").forEach(b=>b.onclick=()=>{S.planSel=b.dataset.v;render()});
  view.querySelectorAll(".chip[data-c]").forEach(c=>c.onclick=()=>{S.planPaint=S.planPaint===c.dataset.c?null:c.dataset.c;render()});
  $("newCourse").onclick=()=>openCourse(null);const ec=$("editCourse");if(ec)ec.onclick=()=>openCourse(courseById(paint));
  $("times").onclick=()=>openTimes(v);$("newVer").onclick=()=>openNewVersion(v);
  /* Tippen und Ziehen */
  let drag=null;
  const tapCell=async(d,i)=>{const it=cellOf(d,i);if(!paint){openCell(v,d,i);return}
    if(it&&it.courseId===paint)v.items=v.items.filter(x=>x.id!==it.id);else if(it)v.items=v.items.map(x=>x.id===it.id?Object.assign({},x,{courseId:paint}):x);else v.items=v.items.concat([{id:uid(),day:d,from:i+1,to:i+1,courseId:paint}]);
    S.ovLoaded=false;render();await persistPlan()};
  const moveCell=async(from,to)=>{const a=cellOf(from.d,from.i),b=cellOf(to.d,to.i);if(!a)return;
    v.items=v.items.map(x=>x.id===a.id?Object.assign({},x,{day:to.d,from:to.i+1,to:to.i+1}):(b&&x.id===b.id?Object.assign({},x,{day:from.d,from:from.i+1,to:from.i+1}):x));S.ovLoaded=false;render();await persistPlan()};
  view.querySelectorAll(".cell").forEach(c=>{const d=Number(c.dataset.d),i=Number(c.dataset.i);
    c.onpointerdown=ev=>{drag={d,i,x:ev.clientX,y:ev.clientY,moved:false,filled:c.classList.contains("f")};if(drag.filled){try{c.setPointerCapture(ev.pointerId)}catch(e){}}};
    c.onpointermove=ev=>{if(!drag||!drag.filled)return;if(!drag.moved&&Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y)>8){drag.moved=true;c.classList.add("drag")}
      if(drag.moved){view.querySelectorAll(".cell.over").forEach(x=>x.classList.remove("over"));const el=document.elementFromPoint(ev.clientX,ev.clientY);const tgt=el&&el.closest?el.closest(".cell"):null;if(tgt&&tgt!==c)tgt.classList.add("over")}};
    c.onpointerup=ev=>{if(!drag)return;const dr=drag;drag=null;c.classList.remove("drag");view.querySelectorAll(".cell.over").forEach(x=>x.classList.remove("over"));
      if(dr.moved){const el=document.elementFromPoint(ev.clientX,ev.clientY);const tgt=el&&el.closest?el.closest(".cell"):null;if(tgt&&tgt!==c)moveCell(dr,{d:Number(tgt.dataset.d),i:Number(tgt.dataset.i)});return}
      tapCell(d,i)};
    c.onpointercancel=()=>{drag=null;c.classList.remove("drag")};
    c.onclick=ev=>ev.preventDefault()});
}

function openFree(key){

  const own=(S.settings.free||[]).filter(r=>r.from<=ss&&r.to>=ms);

    <div class="two"><div class="field"><label>Frei von</label><input type="date" id="fFrom" value="${ms}"></div><div class="field"><label>bis</label><input type="date" id="fTo" value="${ymd(addDays(mon,4))}"></div></div>

    <p class="note" style="margin:0 0 6px">${p.cancelled?"Als entfallen markiert, zählt in dieser Woche nicht.":"Nur diese Stunde in dieser Woche, der Stundenplan bleibt. Ganze freie Tage besser über „Frei?“."}</p>
    <div class="acts"><button class="btn" id="c">Schließen</button><button class="btn ${p.cancelled?"p":""}" id="t" ${p.cancelled?"":'style="color:var(--danger)"'}>${p.cancelled?"Wieder zählen":"Entfällt"}</button></div>`);
  $("c").onclick=close;$("t").onclick=async()=>{const w=await ensureWeek(key);const c=(w.cancelled||[]).slice();w.cancelled=c.includes(p.planId)?c.filter(x=>x!==p.planId):c.concat([p.planId]);close();await persistWeek(key);render()}}
function openCell(v,d,i){
  const r=v.raster;const it=v.items.find(x=>x.day===d&&x.from===i+1);
  open(`<h2>${WDL[d]}, ${i+1}. Stunde</h2><div class="sub">${r[i][0]} bis ${r[i][1]}${v.from?" · Plan "+(v.from>ymd(new Date())?"ab ":"seit ")+fmtDate(v.from):""}</div>
    <div class="chips" id="cs">${S.courses.map(c=>`<button data-c="${c.id}" class="${it&&it.courseId===c.id?"on":""}"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c.color};margin-right:6px"></i>${esc(c.name)}</button>`).join("")}</div>
    <div class="field"><label>Neuer Kurs</label><input type="text" id="nc" placeholder="z.B. F Q1"></div>
    <div class="acts">${it?'<button class="btn dg" id="clr">Leeren</button>':""}<button class="btn" id="c">Abbrechen</button><button class="btn p" id="s">Eintragen</button></div>`);
  let sel=it?it.courseId:null;
  $("cs").querySelectorAll("button").forEach(b=>b.onclick=()=>{sel=b.dataset.c;$("nc").value="";$("cs").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))});
  $("c").onclick=close;const clr=$("clr");if(clr)clr.onclick=async()=>{v.items=v.items.filter(x=>x.id!==it.id);close();await persistPlan();render()};
  $("s").onclick=async()=>{let cid=sel;const nn=$("nc").value.trim();if(nn){const c={id:uid(),name:nn,color:PALETTE[S.courses.length%PALETTE.length]};S.courses=S.courses.concat([c]);cid=c.id;await persistCourses()}
    if(!cid){toast("Kurs wählen oder anlegen");return}
    if(it)v.items=v.items.map(x=>x.id===it.id?Object.assign({},x,{courseId:cid}):x);else v.items=v.items.concat([{id:uid(),day:d,from:i+1,to:i+1,courseId:cid}]);
    close();await persistPlan();render()}}
function openNewVersion(v){
  const def=ymd(addDays(mondayOf(new Date()),7));const canDel=S.plan.versions.length>1&&v.from;
  open(`<h2>Neuer Stundenplan</h2><div class="sub">Der aktuelle Plan wird kopiert und gilt ab dem gewählten Datum als neue Version. Wochen davor rechnen weiter mit dem alten Plan.</div>
    <div class="field"><label>Gilt ab</label><input type="date" id="vFrom" value="${def}"></div>
    <div class="acts">${canDel?'<button class="btn dg" id="vDel">Diese Version löschen</button>':""}<button class="btn" id="c">Abbrechen</button><button class="btn p" id="s">Anlegen</button></div>`);
  $("c").onclick=close;
  const del=$("vDel");if(del)del.onclick=()=>ask("Diese Planversion löschen? Ihr Zeitraum fällt auf die vorige Version zurück.","Löschen",async()=>{S.plan.versions=S.plan.versions.filter(x=>x.id!==v.id);S.planSel=null;S.ovLoaded=false;await persistPlan();render()});
  $("s").onclick=async()=>{const f=$("vFrom").value;if(!f){toast("Datum fehlt");return}if(S.plan.versions.some(x=>x.from===f)){toast("Für dieses Datum gibt es schon einen Plan");return}
    const nv={id:uid(),from:f,items:v.items.map(x=>Object.assign({},x,{id:uid()})),raster:v.raster.map(x=>x.slice())};S.plan.versions=S.plan.versions.concat([nv]).sort((a,b)=>(a.from||"")<(b.from||"")?-1:1);S.planSel=nv.id;S.ovLoaded=false;close();await persistPlan();render()}}
function openCourse(c){
  open(`<h2>${c?"Kurs":"Neuer Kurs"}</h2><div class="field"><label>Name</label><input type="text" id="cn" value="${esc(c?c.name:"")}" placeholder="z.B. Ge 8f"></div>
    <div class="field"><label>Farbe</label><div class="chips" id="pal">${PALETTE.map(p=>`<button data-p="${p}" style="background:${p};border-color:${p};min-width:40px;height:40px;padding:0;${c&&c.color===p?"outline:3px solid var(--ink);outline-offset:2px":""}"></button>`).join("")}</div></div>
    <div class="acts">${c?'<button class="btn dg" id="del">Löschen</button>':""}<button class="btn" id="cc">Abbrechen</button><button class="btn p" id="cs">Speichern</button></div>`);
  let col=c?c.color:PALETTE[S.courses.length%PALETTE.length];
  $("pal").querySelectorAll("button").forEach(b=>b.onclick=()=>{col=b.dataset.p;$("pal").querySelectorAll("button").forEach(x=>x.style.outline=x===b?"3px solid var(--ink)":"none")});
  $("cc").onclick=close;
  const del=$("del");if(del)del.onclick=()=>ask("Kurs löschen? Seine Stunden verschwinden aus allen Planversionen, alte Wochen behalten die Zeiten unter „Unterricht“.","Löschen",async()=>{S.courses=S.courses.filter(x=>x.id!==c.id);S.plan.versions.forEach(v=>{v.items=v.items.filter(x=>x.courseId!==c.id)});await persistCourses();await persistPlan();render()});
  $("cs").onclick=async()=>{const n=$("cn").value.trim();if(!n){toast("Name fehlt");return}if(c)S.courses=S.courses.map(x=>x.id===c.id?Object.assign({},x,{name:n,color:col}):x);else S.courses=S.courses.concat([{id:uid(),name:n,color:col}]);close();await persistCourses();render()}}
function openTimes(v){
  const r=v.raster;
  open(`<h2>Stundenzeiten</h2><div class="sub">Beginn und Ende je Schulstunde${v.from?", Plan "+fmtDate(v.from):""}.</div><table class="tt" id="tt">${r.map((t,i)=>`<tr><td>${i+1}.</td><td><input type="time" class="a" value="${t[0]}"></td><td><input type="time" class="b" value="${t[1]}"></td></tr>`).join("")}</table>
    <button class="link" id="more">+ Stunde</button><div class="acts"><button class="btn" id="c">Abbrechen</button><button class="btn p" id="s">Speichern</button></div>`);
  $("more").onclick=()=>{const tr=document.createElement("tr");const n=$("tt").rows.length+1;tr.innerHTML=`<td>${n}.</td><td><input type="time" class="a"></td><td><input type="time" class="b"></td></tr>`;$("tt").appendChild(tr)};
  $("c").onclick=close;
  $("s").onclick=async()=>{const a=[...$("tt").querySelectorAll(".a")],b=[...$("tt").querySelectorAll(".b")];const nr=a.map((x,i)=>[x.value,b[i].value]).filter(x=>x[0]&&x[1]);if(!nr.length){toast("Mindestens eine Stunde");return}v.raster=nr;v.items=v.items.filter(it=>!it.from||it.from<=nr.length);close();await persistPlan();render()}}
function openSettings(){
  const to=ymd(new Date()),from=ymd(addDays(mondayOf(new Date()),-7*8));
  open(`<h2>Einstellungen</h2>
    <div class="field"><label>Wochen-Soll in Stunden</label><input type="number" id="tg" step="0.5" min="0" value="${S.settings.weeklyTarget}"></div>
    <div class="field"><label>Export als CSV</label><div class="two"><input type="date" id="xf" value="${from}"><input type="date" id="xt" value="${to}"></div></div>
    <div class="acts"><button class="btn" id="csv">CSV</button><button class="btn" id="json">Backup sichern</button><button class="btn" id="imp">Backup einspielen</button></div><input type="file" id="impFile" accept=".json,application/json" style="display:none"><div id="xo"></div>
    <p class="note">${S.user?"Angemeldet als "+esc(S.user.email)+". Änderungen werden auf allen angemeldeten Geräten synchronisiert, offline zwischengespeichert.":"Nicht angemeldet, Daten liegen nur auf diesem Gerät."}</p>
    <p class="note">Als App installieren: Android Chrome Menü „Zum Startbildschirm hinzufügen“, iPad Safari Teilen „Zum Home-Bildschirm“, Windows Chrome/Edge Adressleiste „App installieren“.</p>
    <div class="acts">${S.user?'<button class="btn dg" id="lo">Abmelden</button>':""}<button class="btn" id="c">Schließen</button><button class="btn p" id="s">Speichern</button></div>`);
  const lo=$("lo");if(lo)lo.onclick=()=>ask("Abmelden? Die Daten bleiben im Konto und erscheinen nach erneuter Anmeldung.","Abmelden",()=>{close();logout()});
  $("c").onclick=close;$("s").onclick=async()=>{const t=Number($("tg").value);if(isNaN(t)||t<0){toast("Zahl prüfen");return}S.settings.weeklyTarget=t;close();await persistSettings();render()};
  $("csv").onclick=()=>exportCsv($("xf").value,$("xt").value);$("json").onclick=exportJson;
  $("imp").onclick=()=>$("impFile").click();$("impFile").onchange=ev=>{const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{let o;try{o=JSON.parse(rd.result)}catch(e){toast("Datei nicht lesbar");return}
    const nW=Array.isArray(o.weeks)?o.weeks.length:0;ask(`Backup vom ${o.exportiert?new Date(o.exportiert).toLocaleDateString("de-DE"):"?"} einspielen? ${nW} Wochen, ${(o.courses||[]).length} Kurse. Gleiche Wochen werden überschrieben.`,"Einspielen",()=>importBackup(o))};rd.readAsText(f)}}
async function importBackup(o){if(Array.isArray(o.courses)){S.courses=o.courses;await persistCourses()}if(o.settings){S.settings=normSettings(o.settings);await persistSettings()}if(o.stundenplan||o.plan){S.plan=normPlan(o.stundenplan||o.plan);await persistPlan()}
  if(Array.isArray(o.weeks)){for(const w of o.weeks){if(!w||!w.key)continue;S.weeks[w.key]=weekFromDoc(w.key,w);await persistWeek(w.key)}}S.ovLoaded=false;render();toast("Backup eingespielt")}



/* Export */
async function deliver(name,data){try{const blob=new Blob([data],{type:name.endsWith(".csv")?"text/csv;charset=utf-8":"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},2000);toast("Datei gespeichert")}catch(e){const o=$("xo");if(o)o.innerHTML=`<div class="field"><label>Download nicht möglich, Inhalt kopieren:</label><textarea rows="6" readonly>${esc(data)}</textarea></div>`}}
async function exportCsv(from,to){if(!from||!to){toast("Zeitraum angeben");return}
  const weeks=await weeksInRange(weekKeyOf(from),weekKeyOf(to));const keys=new Set(Object.keys(weeks));let m=mondayOf(parseYmd(from));const end=parseYmd(to);while(m<=end){keys.add(weekKeyOfDate(m));m=addDays(m,7)}
  const rows=[];keys.forEach(k=>{effectiveEntries(k).forEach(e=>{if(e.date>=from&&e.date<=to)rows.push(e)})});rows.sort((a,b)=>(a.date+(a.start||"99"))<(b.date+(b.start||"99"))?-1:1);
  const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';const lines=["Datum;Wochentag;KW;Kategorie;Kurs;Von;Bis;Minuten;Stunden;Quelle"];
  rows.forEach(e=>{const d=parseYmd(e.date);lines.push([e.date,WD[(d.getDay()+6)%7],isoWeek(d).week,q(e.activity),q(e.plan?courseName(e.courseId):""),e.start||"",e.end||"",e.minutes,(e.minutes/60).toFixed(2).replace(".",","),e.plan?"Stundenplan":"manuell"].join(";"))});
  await deliver("lehrerzeit_"+from+"_"+to+".csv","\ufeff"+lines.join("\r\n"))}
async function exportJson(){const weeks=await weeksInRange("0000-W00","9999-W99");await deliver("lehrerzeit_backup_"+ymd(new Date())+".json",JSON.stringify({exportiert:new Date().toISOString(),courses:S.courses,settings:S.settings,stundenplan:S.plan,weeks:Object.values(weeks)},null,1))}

let toastT=null;function toast(m,label,fn,ms){const t=$("toast");t.innerHTML=`<span>${esc(m)}</span>`+(label?`<button id="toastBtn">${esc(label)}</button>`:"");t.classList.toggle("act",!!label);t.classList.add("show");clearTimeout(toastT);if(label)$("toastBtn").onclick=()=>{t.classList.remove("show");fn()};toastT=setTimeout(()=>t.classList.remove("show"),ms||2200)}
authBind();init();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.tab==="woche")render()});
})();
</script>
</body>
</html>
